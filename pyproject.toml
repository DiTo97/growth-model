# Workspace root. Each member under packages/ and apps/ is its own distribution.
[project]
name = "growth-model-workspace"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "growth-model-core",
  "growth-model-sdk",
  "growth-model-api",
  "growth-model-cli",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "pyright>=1.1.390",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "packages/sdk-python", "apps/api", "apps/cli"]

[tool.uv.sources]
growth-model-core = { workspace = true }
growth-model-sdk = { workspace = true }
growth-model-api = { workspace = true }
growth-model-cli = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "packages/sdk-python/tests", "apps/api/tests", "apps/cli/tests"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["packages/sdk-js", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]
ignore = ["S101", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B"]

[tool.pyright]
include = ["packages/core/src", "packages/sdk-python/src", "apps/api/src", "apps/cli/src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.ruff.lint.isort]
known-first-party = ["growth_model_core", "growth_model_sdk", "growth_model_api", "growth_model_cli"]
