# Local stack: Postgres + API. `docker compose -f infra/docker-compose.yml up --build`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: growth
      POSTGRES_PASSWORD: growth
      POSTGRES_DB: growth
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growth"]
      interval: 2s
      retries: 30

  api:
    build: { context: .., dockerfile: infra/docker/Dockerfile }
    environment:
      DATABASE_URL: postgresql+psycopg://growth:growth@db:5432/growth
      GROWTH_MODEL_ADMIN_TOKEN: ${GROWTH_MODEL_ADMIN_TOKEN:?set an admin token}
      CORS_ORIGINS: http://localhost:5173
      SUPABASE_URL: ${SUPABASE_URL:-}
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
