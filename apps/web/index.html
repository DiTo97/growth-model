<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Growth Model Console</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="./config.js"></script>
  </head>
  <body>
    <header>
      <h1>Growth Model</h1>
      <div id="auth">
        <form id="login" hidden>
          <input id="email" type="email" placeholder="you@company.com" required />
          <button>Send magic link</button>
        </form>
        <span id="who"></span>
        <button id="logout" hidden>Sign out</button>
      </div>
    </header>
    <main>
      <p id="status" role="status"></p>

      <section>
        <h2>DAU / WAU / MAU</h2>
        <svg id="chart" viewBox="0 0 800 240" preserveAspectRatio="none" aria-label="Active users over time"></svg>
        <div class="legend"><span class="dau">DAU</span><span class="wau">WAU</span><span class="mau">MAU</span></div>
      </section>

      <section class="grid">
        <div>
          <h2>Fitted rates <small id="asof"></small></h2>
          <table id="rates"></table>
        </div>
        <div>
          <h2>What if…</h2>
          <form id="sim">
            <label>Horizon (days) <input name="horizon" type="number" value="365" min="1" max="3650" /></label>
            <div id="overrides"></div>
            <button>Simulate</button>
          </form>
          <p id="simresult"></p>
        </div>
      </section>

      <section>
        <h2>Lever ranking <small>2% month-over-month improvement, 3-year DAU impact</small></h2>
        <button id="levers">Run lever analysis</button>
        <table id="levertable"></table>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
