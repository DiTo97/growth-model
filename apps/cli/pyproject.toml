[project]
name = "growth-model-cli"
version = "0.1.0"
description = "CLI for growth-model analysis: fit, simulate and rank levers locally or against the API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["growth-model-core", "typer>=0.12", "httpx>=0.27"]

[project.scripts]
growth-model = "growth_model_cli.main:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
