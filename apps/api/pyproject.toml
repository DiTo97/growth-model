[project]
name = "growth-model-api"
version = "0.1.0"
description = "Multi-tenant HTTP service for the growth model: ingest, daily segmentation, weekly fits, simulations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "growth-model-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
growth-model-server = "growth_model_api.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
